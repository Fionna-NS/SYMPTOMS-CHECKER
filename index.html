<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symptom Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Symptom Tracker</h1>
        <p>Enter a symptom and save it.</p>

        <div class="form">
            <label for="symptomInput">Symptom</label>
            <input type="text" id="symptomInput" placeholder="Enter a symptom">
            <button type="button" id="saveBtn">Save Symptom</button>
        </div>

        <h2>Saved Symptoms</h2>
        <ul id="symptomList"></ul>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
